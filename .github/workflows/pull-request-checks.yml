          node .devai/state/pr-bootstrap/cli/bin.js check --preflight --run --base "$DEVAI_PREFLIGHT_BASE" --as-role inspector --write --format json
          # Gate invariant producers (ADR-SCR-0013): trace resolution for INV-DEVAI-002 and the
          # exact-head scorecard composition for INV-HARNESS-006, blueprint validation of the
          # committed gate fixture for INV-DEVAI-010, and pack resolution against the committed
          # packs fixture for INV-HARNESS-010, each failing the step on its own.
          node .devai/state/pr-bootstrap/cli/bin.js sense run trace_resolution --as-role inspector --format json
          node .devai/state/pr-bootstrap/cli/bin.js audit scorecard --repo-root . --at "$(git rev-parse HEAD)" --format human
          node .devai/state/pr-bootstrap/cli/bin.js check --only blueprint --file packages/skills/tests/operations/fixtures/blueprint.json --format human
          node .devai/state/pr-bootstrap/cli/bin.js sense inventory --slice pack --packs-root packages/skills/tests/fixtures/pack-resolution --adopter-root packages/skills/tests/fixtures/pack-resolution --format human

      - name: Affected checks and profile-selected candidate preflight
        id: affected
        shell: bash
        # The gate invocation is the local one (ADR-CHK-0001 IA-003) on one side of the
        # partitioned plan (ADR-CHK-0007 rule 11); on failure its one-line report is
        # summarized per failing node so the log names it (#248).
        run: |
          set -euo pipefail
          pnpm run release:pr-gate -- "$DEVAI_PREFLIGHT_BASE"
          report="$RUNNER_TEMP/devai-gate-report-rest/report.json"
          mkdir -p "$RUNNER_TEMP/devai-gate-report-rest"
          status=0
          node .devai/state/pr-bootstrap/cli/bin.js check --affected --run --base "$DEVAI_PREFLIGHT_BASE" --partition-exclude test:cli --as-role inspector --write --format json | tee "$report" || status=$?
          if [ "$status" -ne 0 ]; then
