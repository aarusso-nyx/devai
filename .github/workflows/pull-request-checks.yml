      - name: Upload the partition report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-gate-report-rest
          path: ${{ runner.temp }}/devai-gate-report-rest/report.json
          if-no-files-found: ignore
          retention-days: 7

  # The required check (ADR-CHK-0007 rule 11): it runs no check node and passes only when both
  # partition jobs succeeded and their reports own every planned node exactly once, as PASS.
  gate:
    name: devai-release-gate
    needs: [gate-cli, gate-rest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node-toolchain

      - name: Download the partition reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: devai-gate-report-*
          path: ${{ runner.temp }}/gate-reports

      - name: Aggregate the partition reports
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aggregate-gate-partitions.mjs --include-report "$RUNNER_TEMP/gate-reports/devai-gate-report-cli" --exclude-report "$RUNNER_TEMP/gate-reports/devai-gate-report-rest" --include-result "${{ needs.gate-cli.result }}" --exclude-result "${{ needs.gate-rest.result }}"
