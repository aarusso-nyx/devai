name: Pull request preflight

# Non-attesting preflight. See docs/dev/operations/remote-preflight-contract.md.
# This workflow produces no attested evidence and cannot sign, export, or
# supplement a candidate receipt. A transient preflight receipt only gates the
# current run; a green run is a contradiction check, not a release claim.

# Under merge_group the candidate is the queue entry's head and the base is the
# queue base; under pull_request they are the pull request's head and base
# (remote-preflight-contract.md, Queue admission). Each queue entry has its own
# concurrency group, so no entry cancels another; a new head of the same pull
# request still cancels the previous one (ADR-CHK-0004).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'merge_group' && format('{0}-mq-{1}', github.workflow, github.event.merge_group.head_sha) || format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: devai-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVAI_PREFLIGHT_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-node-toolchain
        with:
          setup-pnpm: 'true'
          cache: pnpm

      # The bootstrap output is keyed by the digest of the TypeScript inputs it
      # compiles, so a candidate that changes no source restores the runner
      # instead of compiling it; a stale key only causes a recompile
      # (ADR-CHK-0003).
      - name: Restore the check runner bootstrap
        id: bootstrap-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .devai/state/pr-bootstrap
          key: pr-bootstrap-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/*/src/**/*.ts', 'packages/*/package.json', 'scripts/process/bootstrap-check-runner.mjs') }}

      # Three steps, each failing the job on its own; the runner report replaces
      # the former step-level aggregator (ADR-CHK-0001).
      - name: Compile the check runner bootstrap
        id: install
        run: |
          pnpm install --frozen-lockfile
          if [ "${{ steps.bootstrap-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm run release:bootstrap
          fi

      - name: Preflight probes
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/devai-verifier-package"
          package_root="packages/cli"
          source_root="$package_root/vendor/evidence-verification"
          provenance="$source_root/provenance.json"
          actual_provenance_sha256="$(sha256sum "$provenance" | cut -d' ' -f1)"
          verifier_root="$control/evidence-verification"
          mkdir -p "$verifier_root"
          cp "$source_root/provenance.json" "$verifier_root/provenance.json"
          cp -R "$source_root/schemas" "$source_root/src" "$verifier_root/"
          node - "$package_root" "$verifier_root" <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const [packageRoot, verifierRoot] = process.argv.slice(2);
          const expectedBins = {
            'devai-evidence-policy': './dist/runtime/evidence-verification/src/build-policy-cli.js',
            'devai-evidence-verify': './dist/runtime/evidence-verification/src/cli.js',
            'devai-evidence-bundle-verify': './dist/runtime/evidence-verification/src/bundle-cli.js',
            'devai-evidence-export': './dist/runtime/evidence-verification/src/export-cli.js',
            'devai-evidence-publish': './dist/runtime/evidence-verification/src/publish-cli.js',
          };
          const manifest = JSON.parse(readFileSync(join(packageRoot, 'package.json'), 'utf8'));
          if (manifest.name !== '@aarusso-nyx/devai') throw new Error('DEVAI_VERIFIER_PACKAGE_IDENTITY_INVALID');
          for (const [name, path] of Object.entries(expectedBins)) {
            if (manifest.bin?.[name] !== path) throw new Error('DEVAI_VERIFIER_PACKAGE_BIN_INVALID:' + name);
          }
          const provenancePath = join(verifierRoot, 'provenance.json');
          const provenance = JSON.parse(readFileSync(provenancePath, 'utf8'));
          if (provenance.schemaVersion !== '1.0.0' || provenance.sourceCommit !== '8b215d706a828af7361f9c6799b9cb0a30c9d00b') {
            throw new Error('DEVAI_VERIFIER_PACKAGE_PROVENANCE_INVALID');
          }
          const listed = new Map(provenance.files.map((entry) => [entry.path, entry.sha256]));
          const walk = (root, directory = root) => readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const path = join(directory, entry.name);
            if (entry.isSymbolicLink() || (!entry.isDirectory() && !entry.isFile())) {
              throw new Error('DEVAI_VERIFIER_PACKAGE_SPECIAL_FILE_INVALID:' + relative(root, path));
            }
            return entry.isDirectory() ? walk(root, path) : [relative(root, path)];
          });
          const actual = walk(verifierRoot).filter((path) => path !== 'provenance.json').sort();
          if (JSON.stringify(actual) !== JSON.stringify([...listed.keys()].sort())) {
            throw new Error('DEVAI_VERIFIER_PACKAGE_POPULATION_INVALID');
          }
          for (const [path, expected] of listed) {
            const file = join(verifierRoot, path);
            const actualDigest = createHash('sha256').update(readFileSync(file)).digest('hex');
            if (actualDigest !== expected) throw new Error('DEVAI_VERIFIER_PACKAGE_FILE_DIGEST_INVALID:' + path);
          }
          NODE
          {
            echo "DEVAI_EVIDENCE_POLICY=$verifier_root/src/build-policy-cli.js"
            echo "DEVAI_EVIDENCE_VERIFY=$verifier_root/src/cli.js"
            echo "DEVAI_EVIDENCE_BUNDLE_VERIFY=$verifier_root/src/bundle-cli.js"
          } >> "$GITHUB_ENV"
          echo "version=1.5.1" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$actual_provenance_sha256" >> "$GITHUB_OUTPUT"
          node .devai/state/pr-bootstrap/cli/bin.js init bind --target . --as-role architect --write --format json
          node .devai/state/pr-bootstrap/cli/bin.js check --preflight --run --base "$DEVAI_PREFLIGHT_BASE" --as-role inspector --write --format json > "$RUNNER_TEMP/devai-preflight.json"

      - name: Affected checks and profile-selected candidate preflight
        id: affected
        run: pnpm run release:pr-gate -- "$DEVAI_PREFLIGHT_BASE" && node .devai/state/pr-bootstrap/cli/bin.js check --affected --run --base "$DEVAI_PREFLIGHT_BASE" --as-role inspector --write --format json > "$RUNNER_TEMP/devai-affected.json"

      - name: Verify candidate invariant and trace evidence
        id: soft-gate
        shell: bash
        env:
          DEVAI_SOFT_GATE_TRUST_JSON: ${{ vars.DEVAI_SOFT_GATE_TRUST_JSON }}
        run: |
          set -euo pipefail
          node .devai/state/pr-bootstrap/cli/bin.js check --only trace --format json > "$RUNNER_TEMP/devai-trace.json"
          node .devai/state/pr-bootstrap/cli/bin.js check --only test-trace --format json > "$RUNNER_TEMP/devai-test-trace.json"
          node .devai/state/pr-bootstrap/cli/bin.js audit scorecard --repo-root . --at "$(git rev-parse HEAD)" --format json > "$RUNNER_TEMP/devai-scorecard.json"
          node scripts/process/check-ci-invariant-gate.mjs --fetch-script scripts/process/fetch-ci-invariant-evidence.mjs --preflight "$RUNNER_TEMP/devai-preflight.json" --affected "$RUNNER_TEMP/devai-affected.json" --trace "$RUNNER_TEMP/devai-trace.json" --test-trace "$RUNNER_TEMP/devai-test-trace.json" --scorecard "$RUNNER_TEMP/devai-scorecard.json"
