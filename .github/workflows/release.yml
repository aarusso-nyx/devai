name: Rehearse or promote DEVAI release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed annotated version tag to rehearse or publish
        required: true
        type: string
      publish:
        description: Finalize publication for the exact rehearsed tag
        required: false
        default: false
        type: boolean
      publish_pages:
        description: Deploy the manifest-bound site after package publication
        required: false
        default: false
        type: boolean
      candidate_commit:
        description: Exact commit on main to rehearse; omitted for promotion
        required: false
        type: string
      rehearsal_run_id:
        description: Exact successful rehearsal run to promote
        required: false
        type: string
      rehearsal_attempt:
        description: Exact successful rehearsal run attempt
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: devai-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  PACKAGE_NAME: '@aarusso-nyx/devai'
  EXPECTED_ACTION_COUNT: 57
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish && inputs.release_tag || inputs.candidate_commit) || github.ref }}
jobs:
  verify-ledger:
    name: Verify protected RC ledger
    runs-on: ubuntu-latest
    environment: devai-ledger-verification
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.bindings.outputs.commit }}
      tree: ${{ steps.bindings.outputs.tree }}
      envelope_sha256: ${{ steps.bindings.outputs.envelope_sha256 }}
      results_sha256: ${{ steps.bindings.outputs.results_sha256 }}
      artifacts_sha256: ${{ steps.bindings.outputs.artifacts_sha256 }}
      task_policy_sha256: ${{ steps.bindings.outputs.task_policy_sha256 }}
      trust_store_sha256: ${{ steps.bindings.outputs.trust_store_sha256 }}
      toolchain_sha256: ${{ steps.bindings.outputs.toolchain_sha256 }}
      environment_sha256: ${{ steps.bindings.outputs.environment_sha256 }}
      release_signers_sha256: ${{ steps.bindings.outputs.release_signers_sha256 }}
      policy_digest: ${{ steps.bindings.outputs.policy_digest }}
      verifier_package_version: ${{ steps.verifier-package.outputs.version }}
      verifier_provenance_sha256: ${{ steps.verifier-package.outputs.provenance_sha256 }}
      ledger_json: ${{ steps.bindings.outputs.ledger_json }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verifier runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Materialize protected DEVAI verifier package
        id: verifier-package
        shell: bash
        env:
          VERIFIER_PROVENANCE_SHA256: ${{ vars.DEVAI_LEDGER_VERIFIER_PROVENANCE_SHA256 }}
        run: |
          set -euo pipefail
          test "$VERIFIER_PROVENANCE_SHA256" != ""
          test "${#VERIFIER_PROVENANCE_SHA256}" = 64
          control="$RUNNER_TEMP/devai-verifier-package"
          source="$control/source"
          trusted_commit="8b600ed16ebd101ff88ecfaac9cc04abcf0ce174"
          trusted_tree="d2f60e0602ffc849e9b5b1b52ca54731eca7c8b1"
          test "$(git -C candidate cat-file -t "$trusted_commit")" = commit
          test "$(git -C candidate rev-parse "$trusted_commit^{tree}")" = "$trusted_tree"
          mkdir -p "$source"
          git -C candidate archive "$trusted_commit" \
            packages/cli/package.json packages/cli/vendor/evidence-verification | tar -x -C "$source"
          package_root="$source/packages/cli"
          source_root="$package_root/vendor/evidence-verification"
          provenance="$source_root/provenance.json"
          actual_provenance_sha256="$(sha256sum "$provenance" | cut -d' ' -f1)"
          test "$actual_provenance_sha256" = "$VERIFIER_PROVENANCE_SHA256"
          verifier_root="$control/evidence-verification"
          mkdir -p "$verifier_root"
          cp "$source_root/provenance.json" "$verifier_root/provenance.json"
          cp -R "$source_root/schemas" "$source_root/src" "$verifier_root/"
          node - "$package_root" "$verifier_root" <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const [packageRoot, verifierRoot] = process.argv.slice(2);
          const expectedBins = {
            'devai-evidence-policy': './dist/runtime/evidence-verification/src/build-policy-cli.js',
            'devai-evidence-verify': './dist/runtime/evidence-verification/src/cli.js',
            'devai-evidence-bundle-verify': './dist/runtime/evidence-verification/src/bundle-cli.js',
            'devai-evidence-export': './dist/runtime/evidence-verification/src/export-cli.js',
            'devai-evidence-publish': './dist/runtime/evidence-verification/src/publish-cli.js',
          };
          const manifest = JSON.parse(readFileSync(join(packageRoot, 'package.json'), 'utf8'));
          if (manifest.name !== '@aarusso-nyx/devai') throw new Error('DEVAI_VERIFIER_PACKAGE_IDENTITY_INVALID');
          for (const [name, path] of Object.entries(expectedBins)) {
            if (manifest.bin?.[name] !== path) throw new Error('DEVAI_VERIFIER_PACKAGE_BIN_INVALID:' + name);
          }
          const provenancePath = join(verifierRoot, 'provenance.json');
          const provenance = JSON.parse(readFileSync(provenancePath, 'utf8'));
          if (provenance.schemaVersion !== '1.0.0' || provenance.sourceCommit !== '8174749ebcfabab246031281a036032f636b8a39') {
            throw new Error('DEVAI_VERIFIER_PACKAGE_PROVENANCE_INVALID');
          }
          const listed = new Map(provenance.files.map((entry) => [entry.path, entry.sha256]));
          const walk = (root, directory = root) => readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const path = join(directory, entry.name);
            if (entry.isSymbolicLink() || (!entry.isDirectory() && !entry.isFile())) {
              throw new Error('DEVAI_VERIFIER_PACKAGE_SPECIAL_FILE_INVALID:' + relative(root, path));
            }
            return entry.isDirectory() ? walk(root, path) : [relative(root, path)];
          });
          const actual = walk(verifierRoot).filter((path) => path !== 'provenance.json').sort();
          if (JSON.stringify(actual) !== JSON.stringify([...listed.keys()].sort())) {
            throw new Error('DEVAI_VERIFIER_PACKAGE_POPULATION_INVALID');
          }
          for (const [path, expected] of listed) {
            const file = join(verifierRoot, path);
            const actualDigest = createHash('sha256').update(readFileSync(file)).digest('hex');
            if (actualDigest !== expected) throw new Error('DEVAI_VERIFIER_PACKAGE_FILE_DIGEST_INVALID:' + path);
          }
          NODE
          {
            echo "DEVAI_EVIDENCE_POLICY=$verifier_root/src/build-policy-cli.js"
            echo "DEVAI_EVIDENCE_VERIFY=$verifier_root/src/cli.js"
            echo "DEVAI_EVIDENCE_BUNDLE_VERIFY=$verifier_root/src/bundle-cli.js"
          } >> "$GITHUB_ENV"
          echo "version=1.5.4" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$actual_provenance_sha256" >> "$GITHUB_OUTPUT"
      - name: Check out approved process controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          path: release-control
          persist-credentials: false
      - name: Bind approved process controls
        shell: bash
        env:
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
      - name: Materialize protected ledger inputs
        shell: bash
        env:
          ENVELOPE_B64: ${{ secrets.DEVAI_LEDGER_ENVELOPE_B64 }}
          RESULTS_TGZ_B64: ${{ secrets.DEVAI_LEDGER_RESULTS_TGZ_B64 }}
          ARTIFACTS_TGZ_B64: ${{ secrets.DEVAI_LEDGER_ARTIFACTS_TGZ_B64 }}
          TASK_POLICY_B64: ${{ secrets.DEVAI_LEDGER_TASK_POLICY_B64 }}
          TRUST_STORE_B64: ${{ secrets.DEVAI_LEDGER_TRUST_STORE_B64 }}
          TOOLCHAIN_B64: ${{ secrets.DEVAI_LEDGER_TOOLCHAIN_B64 }}
          ENVIRONMENT_B64: ${{ secrets.DEVAI_LEDGER_ENVIRONMENT_B64 }}
          RELEASE_SIGNERS_B64: ${{ secrets.DEVAI_RELEASE_SIGNERS_B64 }}
          BUNDLE_SCHEMA_VERSION: '1.0.0'
          LEDGER_TRANSPORT: ${{ vars.DEVAI_LEDGER_TRANSPORT || 'legacy' }}
          BUNDLE_SHA256: ${{ vars.DEVAI_LEDGER_BUNDLE_SHA256 }}
          EVIDENCE_READ_TOKEN: ${{ secrets.DEVAI_EVIDENCE_READ_TOKEN }}
        run: |-
          set -euo pipefail
          umask 077
          python3 release-control/scripts/process/evidence_transport.py materialize --output "$RUNNER_TEMP/devai-ledger-control"
      - name: Bind and verify exact release evidence
        id: bindings
        shell: bash
        env:
          POLICY_DIGEST: ${{ vars.DEVAI_LEDGER_POLICY_DIGEST }}
          REQUIRE_TAG: ${{ github.event_name == 'push' || inputs.publish }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          VERIFIER_PROVENANCE: ${{ vars.DEVAI_LEDGER_VERIFIER_PROVENANCE_SHA256 }}
          VERIFIER_PACKAGE_VERSION: ${{ steps.verifier-package.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$POLICY_DIGEST"
          control="$RUNNER_TEMP/devai-ledger-control"
          commit="$(git -C candidate rev-parse HEAD)"
          tree="$(git -C candidate rev-parse HEAD^{tree})"
          git -C candidate merge-base --is-ancestor "$commit" origin/main
          package_version="$(node -p "require('./candidate/packages/cli/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          if test "$REQUIRE_TAG" = true; then
            test "$(git -C candidate cat-file -t "$RELEASE_TAG")" = tag
            git -C candidate config gpg.format ssh
            git -C candidate config gpg.ssh.allowedSignersFile "$control/release-allowed-signers"
            git -C candidate verify-tag "$RELEASE_TAG"
            test "$(git -C candidate rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          else
            [[ "$CANDIDATE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            test "$CANDIDATE_COMMIT" = "$commit"
          fi
          node "$DEVAI_EVIDENCE_POLICY" \
            --repo candidate \
            --descriptor candidate/test-tasks.json \
            --profile rc \
            --schema-version 1.1.0 \
            --commit "$commit" \
            --tree "$tree" \
            --toolchain "$control/toolchain.json" \
            --environment "$control/environment.json" \
            --output "$control/expected-task-policy.json"
          cmp "$control/expected-task-policy.json" "$control/task-policy.json"
          node "$DEVAI_EVIDENCE_VERIFY" \
            --envelope "$control/envelope.json" \
            --results-dir "$control/results" \
            --artifacts-dir "$control/artifacts" \
            --task-policy "$control/task-policy.json" \
            --trust "$control/trust-store.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$commit" \
            --tree "$tree" \
            --policy-digest "$POLICY_DIGEST" \
            --binding exact-tree
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "envelope_sha256=$(sha256sum "$control/envelope.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "results_sha256=$(sha256sum "$control/results.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifacts_sha256=$(sha256sum "$control/artifacts.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "task_policy_sha256=$(sha256sum "$control/task-policy.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "trust_store_sha256=$(sha256sum "$control/trust-store.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_sha256=$(sha256sum "$control/toolchain.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "environment_sha256=$(sha256sum "$control/environment.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "release_signers_sha256=$(sha256sum "$control/release-allowed-signers" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "policy_digest=$POLICY_DIGEST" >> "$GITHUB_OUTPUT"

          node - "$control" >> "$GITHUB_OUTPUT" <<'NODE'
          const {createHash}=require('node:crypto');
          const {readFileSync}=require('node:fs');
          const root=process.argv[2];
          const fields={envelope_sha256:'envelope.json',results_archive_sha256:'results.tgz',artifacts_archive_sha256:'artifacts.tgz',task_policy_sha256:'task-policy.json',trust_store_sha256:'trust-store.json',toolchain_sha256:'toolchain.json',environment_sha256:'environment.json',release_signers_sha256:'release-allowed-signers'};
          const ledger=Object.fromEntries(Object.entries(fields).map(([key,file])=>[key,createHash('sha256').update(readFileSync(root+'/'+file)).digest('hex')]));
          ledger.verifier_package='@aarusso-nyx/devai';
          ledger.verifier_package_version=process.env.VERIFIER_PACKAGE_VERSION;
          ledger.verifier_source_commit='8174749ebcfabab246031281a036032f636b8a39';
          ledger.policy_digest=process.env.POLICY_DIGEST;
          ledger.verifier_provenance_sha256=process.env.VERIFIER_PROVENANCE;
          console.log('ledger_json='+JSON.stringify(ledger));
          NODE
  build-release:
    name: Build normalized release artifacts
    needs: verify-ledger
    runs-on: ubuntu-latest
    environment: devai-rc-release
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify-ledger.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          run_install: false
      - name: Set up Node and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@aarusso-nyx'
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git rev-parse HEAD)" = "${{ needs.verify-ledger.outputs.commit }}"
          test "$(git rev-parse "${{ needs.verify-ledger.outputs.commit }}^{tree}")" = "${{ needs.verify-ledger.outputs.tree }}"
          test "$(node -p "require('./packages/cli/package.json').name")" = "$PACKAGE_NAME"
          channel="$(node scripts/release-channel.mjs "$package_version")"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "PACKAGE_DIST_TAG=$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.dist_tag)' "$channel")" >> "$GITHUB_ENV"
          echo "RELEASE_IS_PRERELEASE=$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.prerelease))' "$channel")" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package and site once
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run release:static-integrity
          pnpm run release:closure
          npm --prefix docs/site ci
          npm --prefix docs/site run security:check
          npm --prefix docs/site run typecheck
          npm --prefix docs/site run build
      - name: Assemble immutable release artifacts
        id: artifacts
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.verify-ledger.outputs.commit }}
          TREE_SHA: ${{ needs.verify-ledger.outputs.tree }}
          LEDGER_ENVELOPE_SHA256: ${{ needs.verify-ledger.outputs.envelope_sha256 }}
          LEDGER_RESULTS_SHA256: ${{ needs.verify-ledger.outputs.results_sha256 }}
          LEDGER_ARTIFACTS_SHA256: ${{ needs.verify-ledger.outputs.artifacts_sha256 }}
          LEDGER_TASK_POLICY_SHA256: ${{ needs.verify-ledger.outputs.task_policy_sha256 }}
          LEDGER_TRUST_STORE_SHA256: ${{ needs.verify-ledger.outputs.trust_store_sha256 }}
          LEDGER_TOOLCHAIN_SHA256: ${{ needs.verify-ledger.outputs.toolchain_sha256 }}
          LEDGER_ENVIRONMENT_SHA256: ${{ needs.verify-ledger.outputs.environment_sha256 }}
          LEDGER_RELEASE_SIGNERS_SHA256: ${{ needs.verify-ledger.outputs.release_signers_sha256 }}
          LEDGER_POLICY_DIGEST: ${{ needs.verify-ledger.outputs.policy_digest }}
          LEDGER_VERIFIER_PACKAGE_VERSION: ${{ needs.verify-ledger.outputs.verifier_package_version }}
          LEDGER_VERIFIER_PROVENANCE_SHA256: ${{ needs.verify-ledger.outputs.verifier_provenance_sha256 }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/devai-release"
          mkdir -p "$release_dir"
          stage_json="$(node scripts/stage-release-package.mjs --output "$release_dir")"
          tarball="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.tarball)' "$stage_json")"
          sbom="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.sbom)' "$stage_json")"
          package_sha256="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.sha256)' "$stage_json")"
          node packages/cli/scripts/installed-tarball-smoke.mjs --tarball "$tarball" --sha256 "$package_sha256"
          test "$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.reproductions))' "$stage_json")" = 2
          test "$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(p.sbom_subject_sha256)' "$stage_json")" = \
            "$(sha256sum "$tarball" | cut -d' ' -f1)"
          node scripts/process/verify-pages-bytes.mjs local docs/site/build
          site="$release_dir/devai-site-$PACKAGE_VERSION.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$site" -C docs/site/build .
          manifest="$release_dir/release-manifest.json"
          PACKAGE_NAME="$PACKAGE_NAME" RELEASE_TAG="$RELEASE_TAG" PACKAGE_TARBALL="$tarball" \
            SITE_ARCHIVE="$site" SBOM_FILE="$sbom" OUTPUT_FILE="$manifest" \
            node scripts/create-release-manifest.mjs
          (cd "$release_dir" && sha256sum "$(basename "$tarball")" "$(basename "$sbom")" \
            "$(basename "$site")" "$(basename "$manifest")" | sort -k2 > SHA256SUMS)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Upload release candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-release-assets-${{ github.run_attempt }}
          path: ${{ steps.artifacts.outputs.release_dir }}/*
          if-no-files-found: error
          retention-days: 30
        id: upload
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
  verify-linux-adopter:
    name: Verify npm adopter quickstart on Linux
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: devai-release-assets-${{ github.run_attempt }}
          path: release-assets
      - name: Exercise fresh npm adoption, execution, and reuse
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          tarball="$(realpath "$(find release-assets -maxdepth 1 -name '*.tgz' -print -quit)")"
          test -n "$tarball"
          adopter="$RUNNER_TEMP/devai adopter espaço não-ASCII"
          mkdir -p "$adopter"
          cd "$adopter"
          git init --quiet
          git config user.name 'DEVAI Linux Adopter Check'
          git config user.email 'devai-linux@example.invalid'
          node -e 'require("node:fs").writeFileSync("package.json", `${JSON.stringify({ name: "devai-linux-adopter", version: "1.0.0", private: true }, null, 2)}\n`)'
          npm install --save-dev --save-exact "$tarball"
          devai='./node_modules/.bin/devai'
          "$devai" init bind --target . --tier tier1 --constitution --as-role architect --write --format json
          "$devai" init bind --target . --operational-law --as-role architect --write --format json
          "$devai" init bind --target . --subprocess-effects --as-role architect --write --format json
          "$devai" init bind --target . --as-role architect --write --format json
          "$devai" init apply architect --target . --tier tier1 --as-role architect --write --format json
          "$devai" init apply owner --target . --tier tier1 --as-role owner --write --format json
          "$devai" init apply harness --target . --tier tier1 --as-role architect --write --format json
          doctor_json="$RUNNER_TEMP/devai-linux-doctor.json"
          "$devai" doctor --repo-root . --format json > "$doctor_json"
          node -e 'const x=require(process.argv[1]); if (!x.ok || !x.result.value.ok) process.exit(1)' "$doctor_json"
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const descriptor = {
            schemaVersion: '1.0.0',
            descriptorVersion: 'linux-adopter-v1',
            repositoryId: 'example/linux-adopter',
            fallbackNodeId: 'test:local-full',
            dynamicFallbackSelectors: [],
            tasks: [
              {
                nodeId: 'test:project', dependencies: [],
                argv: ['node', '-e', 'process.stdout.write("project pass\\n")'], cwd: '.',
                runner: 'node-v1', inputSelectors: [{ kind: 'glob', pattern: '**' }],
                toolchainKeys: ['node'], allowlistedEnv: [],
                outputContract: { kind: 'test', requiredResult: 'pass' },
              },
              {
                nodeId: 'test:local-full', dependencies: ['test:project'],
                argv: ['node', '-e', 'process.stdout.write("local closure pass\\n")'], cwd: '.',
                runner: 'node-v1', inputSelectors: [{ kind: 'exact', pattern: 'package.json' }],
                toolchainKeys: ['node'], allowlistedEnv: [],
                outputContract: { kind: 'marker', value: 'local' },
              },
            ],
            profiles: [
              { profileId: 'affected', mode: 'affected', requiredNodes: ['test:project'], eligibleNodes: ['test:project', 'test:local-full'] },
              { profileId: 'rc', mode: 'fixed', requiredNodes: ['test:project'] },
            ],
          };
          writeFileSync('test-tasks.json', `${JSON.stringify(descriptor, null, 2)}\n`);
          NODE
          mkdir -p src
          printf '%s\n' 'export const value = 1;' > src/index.js
          git add .
          git commit --quiet -m 'adopt DEVAI'
          plan_json="$RUNNER_TEMP/devai-linux-plan.json"
          first_json="$RUNNER_TEMP/devai-linux-first.json"
          second_json="$RUNNER_TEMP/devai-linux-second.json"
          "$devai" check --local --task-plan --format json > "$plan_json"
          "$devai" check --local --run --as-role inspector --write --format json > "$first_json"
          "$devai" check --local --run --as-role inspector --write --format json > "$second_json"
          node - "$first_json" "$second_json" <<'NODE'
          const [firstPath, secondPath] = process.argv.slice(2);
          const first = require(firstPath).result.value.execution;
          const second = require(secondPath).result.value.execution;
          if (!first.every((task) => task.disposition === 'executed')) process.exit(1);
          if (!second.every((task) => task.disposition === 'reused')) process.exit(1);
          NODE
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
  finalize-release:
    name: Create canonical Release and mirror exact package
    needs:
      - verify-ledger
      - promote-assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    environment: devai-rc-publication
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out approved process controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          path: release-control
          persist-credentials: false
      - name: Bind approved process controls
        shell: bash
        env:
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
      - name: Set up Node and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@aarusso-nyx'
      - name: Bind parameterized release identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          channel="$(node scripts/release-channel.mjs "$package_version")"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "PACKAGE_DIST_TAG=$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.dist_tag)' "$channel")" >> "$GITHUB_ENV"
          echo "RELEASE_IS_PRERELEASE=$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.prerelease))' "$channel")" >> "$GITHUB_ENV"
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.promote-assets.outputs.release_asset_id }}
          path: release-assets
          merge-multiple: true
      - name: Verify canonical asset set
        shell: bash
        run: (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Create or verify immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < <(find release-assets -maxdepth 1 -type f -print | sort)
          state="$(node release-control/scripts/process/publication-state.mjs release "$RELEASE_TAG")"
          if test "$state" = present || test "$state" = draft; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "$RELEASE_IS_PRERELEASE"
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            [[ "$asset_count" =~ ^[0-9]+$ ]]
            if test "$asset_count" -gt 0; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            fi
            missing="$(node release-control/scripts/process/release-recovery.mjs release-assets "$existing" "$state")"
            if test -n "$missing"; then
              while IFS= read -r name; do
                gh release upload "$RELEASE_TAG" "release-assets/$name" --repo "$GITHUB_REPOSITORY"
              done <<< "$missing"
              verified="$RUNNER_TEMP/reconciled-release"
              mkdir -p "$verified"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verified"
              node release-control/scripts/process/release-recovery.mjs release-assets "$verified" present
            fi
            if test "$state" = draft; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
            echo 'Canonical Release exactly matches; completed publication is a no-op.'
          else
            release_flags=()
            if test "$RELEASE_IS_PRERELEASE" = true; then release_flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              "${release_flags[@]}" \
              --title "DEVAI $PACKAGE_VERSION" \
              --notes-file CHANGELOG.md
          fi
      - name: Publish or verify exact GitHub Packages mirror
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_tgz="$(realpath "$(find release-assets -maxdepth 1 -name '*.tgz' -print -quit)")"
          test -n "$source_tgz"
          state="$(node release-control/scripts/process/publication-state.mjs registry "$PACKAGE_VERSION")"
          if test "$state" = present; then
            test "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry https://npm.pkg.github.com)" = "$PACKAGE_VERSION"
          else
            npm publish "$source_tgz" --tag "$PACKAGE_DIST_TAG" --registry https://npm.pkg.github.com
          fi
          project="$RUNNER_TEMP/devai-registry-smoke"
          mkdir -p "$project/registry-pack"
          npm --prefix "$project" init --yes >/dev/null
          npm --prefix "$project" install --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION"
          binary="$project/node_modules/.bin/devai"
          test "$($binary --version | cut -d' ' -f1)" = "devai/$PACKAGE_VERSION"
          test "$("$binary" catalog actions --format json | node -e \
            'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).result.value.length)))')" = "$EXPECTED_ACTION_COUNT"
          npm pack "$PACKAGE_NAME@$PACKAGE_VERSION" \
            --registry https://npm.pkg.github.com \
            --pack-destination "$project/registry-pack" >/dev/null
          registry_tgz="$(find "$project/registry-pack" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$registry_tgz"
          test "$(sha256sum "$source_tgz" | cut -d' ' -f1)" = "$(sha256sum "$registry_tgz" | cut -d' ' -f1)"
          current_dist_version="$(npm view "$PACKAGE_NAME" "dist-tags.$PACKAGE_DIST_TAG" --registry https://npm.pkg.github.com)"
          if test "$current_dist_version" != "$PACKAGE_VERSION"; then
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$PACKAGE_DIST_TAG" --registry https://npm.pkg.github.com
          fi
          test "$(npm view "$PACKAGE_NAME" "dist-tags.$PACKAGE_DIST_TAG" --registry https://npm.pkg.github.com)" = "$PACKAGE_VERSION"
  deploy-pages:
    name: Deploy and verify GitHub Pages
    needs:
      - finalize-release
      - promote-assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    concurrency:
      group: devai-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      deployments: write
      id-token: write
    steps:
      - name: Check out approved Pages verification controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          path: release-control
          persist-credentials: false
      - name: Bind approved Pages verification controls
        shell: bash
        env:
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
      - name: Set up Node for Pages verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Download canonical release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.promote-assets.outputs.release_asset_id }}
          path: release-assets
          merge-multiple: true
      - name: Materialize the manifest-bound site archive
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          site="$(node -e "const m=require('./release-assets/release-manifest.json'); process.stdout.write(m.artifacts.site.file)")"
          mkdir -p pages-site
          tar -xzf "release-assets/$site" -C pages-site
          node release-control/scripts/process/verify-pages-bytes.mjs local pages-site
      - name: Upload exact Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: pages-site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 30
      - name: Reconcile and deploy exact Pages artifact
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          REHEARSAL_RUN: ${{ inputs.rehearsal_run_id }}
          REHEARSAL_ATTEMPT: ${{ inputs.rehearsal_attempt }}
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          PAGES_MIGRATION_AUDIT_JSON: ${{ vars.DEVAI_PAGES_MIGRATION_AUDIT_JSON }}
          PAGES_MIGRATION_AUDIT_SHA256: ${{ vars.DEVAI_PAGES_MIGRATION_AUDIT_SHA256 }}
        run: node release-control/scripts/process/publish-pages.mjs release-assets pages-site pages-publication-record
      - name: Retain Pages reconciliation identifiers
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-pages-publication-${{ github.run_attempt }}
          path: pages-publication-record/*
          if-no-files-found: warn
          retention-days: 30
      - name: Verify live documentation
        shell: bash
        run: |
          set -euo pipefail
          root='https://aarusso-nyx.github.io/devai/'
          expected="@aarusso-nyx/devai@${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            if home="$(curl --fail --location --silent --show-error "${root}?release=${RELEASE_TAG#v}&attempt=$attempt")" &&
              grep -Fq "$expected" <<<"$home"; then
              printf '%s\n' "$expected"
              break
            fi
            if test "$attempt" -eq 12; then
              echo "Published documentation did not expose $expected after 12 attempts." >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --location --retry 8 --retry-delay 5 "${root}docs/adopters/install" >/dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${root}docs/reference/cli" >/dev/null
          node release-control/scripts/process/verify-pages-bytes.mjs live pages-site
  rehearsal-summary:
    name: Verify non-publishing rehearsal assets
    needs:
      - verify-ledger
      - build-release
      - verify-linux-adopter
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out approved process controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          path: release-control
          persist-credentials: false
      - name: Bind approved process controls
        shell: bash
        env:
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Download exact rehearsal assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: devai-release-assets-${{ github.run_attempt }}
          path: release-assets
      - name: Record completed rehearsal
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          mkdir completion
          node - <<'NODE'
          const {writeFileSync}=require('node:fs');
          const e=process.env;
          writeFileSync(e.RUNNER_TEMP+'/rehearsal-context.json',JSON.stringify({repository:e.REPOSITORY,runId:e.RUN_ID,attempt:e.RUN_ATTEMPT,artifactId:e.ARTIFACT_ID,artifactDigest:e.ARTIFACT_DIGEST,workflowCommit:e.WORKFLOW_COMMIT,controlCommit:e.CONTROL_COMMIT}));
          NODE
          node release-control/scripts/process/rehearsal.mjs complete release-assets "$RUNNER_TEMP/rehearsal-context.json" completion/rehearsal-completion.json
          printf '%s\n' 'All required rehearsal checks passed. No publication occurred.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain rehearsal completion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-rehearsal-${{ github.run_attempt }}
          path: completion/rehearsal-completion.json
          if-no-files-found: error
          retention-days: 30
    environment: devai-rc-release
  promote-assets:
    name: Verify and retain exact rehearsed assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: verify-ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: devai-ledger-verification
    permissions:
      contents: read
      actions: read
    outputs:
      release_asset_id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Check out approved process controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
          path: release-control
          persist-credentials: false
      - name: Bind approved process controls
        shell: bash
        env:
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify selected rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN: ${{ inputs.rehearsal_run_id }}
          REHEARSAL_ATTEMPT: ${{ inputs.rehearsal_attempt }}
          RELEASE_COMMIT: ${{ needs.verify-ledger.outputs.commit }}
          RELEASE_TREE: ${{ needs.verify-ledger.outputs.tree }}
          CURRENT_LEDGER: ${{ needs.verify-ledger.outputs.ledger_json }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          CONTROL_COMMIT: ${{ vars.DEVAI_PROCESS_CONTROL_COMMIT }}
        run: |-
          set -euo pipefail
          node - <<'NODE'
          const {writeFileSync}=require('node:fs');
          const e=process.env;
          const expected={repository:'aarusso-nyx/devai',runId:e.REHEARSAL_RUN,attempt:e.REHEARSAL_ATTEMPT,tag:e.RELEASE_TAG,commit:e.RELEASE_COMMIT,tree:e.RELEASE_TREE,workflowCommit:e.WORKFLOW_COMMIT,controlCommit:e.CONTROL_COMMIT,ledger:JSON.parse(e.CURRENT_LEDGER)};
          writeFileSync(e.RUNNER_TEMP+'/promotion.json',JSON.stringify(expected));
          NODE
          node release-control/scripts/process/rehearsal.mjs promote release-assets "$RUNNER_TEMP/promotion.json"
      - name: Retain verified promotion assets
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-release-assets-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
